<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>數據導航－探索未來學習單答案查詢</title>
<style>
  :root{
    --bg:#f5f7fb;
    --card:#ffffff;
    --text:#1f2937;
    --muted:#6b7280;
    --line:#dbe2ea;
    --accent:#2f6f5e;
    --accent2:#e9f4f0;
    --danger:#b42318;
    --shadow:0 10px 30px rgba(15,23,42,.08);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
    background:linear-gradient(180deg,#eef4f1 0,#f8fafc 260px,#f5f7fb 100%);
    color:var(--text);
  }
  .wrap{
    max-width:900px;
    margin:0 auto;
    padding:36px 18px 56px;
  }
  .hero{
    text-align:center;
    margin-bottom:24px;
  }
  .hero h1{
    margin:0 0 8px;
    font-size:clamp(28px,5vw,40px);
    letter-spacing:.04em;
  }
  .hero p{
    margin:0;
    color:var(--muted);
    font-size:15px;
  }
  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:24px;
    box-shadow:var(--shadow);
  }
  .grid{
    display:grid;
    grid-template-columns:1fr 1.4fr;
    gap:20px;
  }
  @media(max-width:700px){
    .grid{grid-template-columns:1fr}
  }
  label.title{
    display:block;
    font-weight:800;
    margin-bottom:8px;
  }
  input[type="number"]{
    width:100%;
    padding:14px 15px;
    font-size:18px;
    border:1px solid #cbd5e1;
    border-radius:12px;
    outline:none;
  }
  input[type="number"]:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(47,111,94,.12);
  }
  .unit-box{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .unit{
    flex:1 1 220px;
    position:relative;
  }
  .unit input{position:absolute;opacity:0;pointer-events:none}
  .unit label{
    display:block;
    border:1px solid #cbd5e1;
    border-radius:14px;
    padding:14px 16px;
    cursor:pointer;
    transition:.18s ease;
    background:#fff;
    font-weight:700;
  }
  .unit input:checked + label{
    border-color:var(--accent);
    background:var(--accent2);
    box-shadow:0 0 0 2px rgba(47,111,94,.1);
  }
  .unit small{
    display:block;
    color:var(--muted);
    font-weight:500;
    margin-top:4px;
  }
  .actions{
    display:flex;
    gap:10px;
    margin-top:20px;
    flex-wrap:wrap;
  }
  button{
    border:none;
    border-radius:12px;
    padding:13px 18px;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
  }
  .primary{
    background:var(--accent);
    color:white;
  }
  .secondary{
    background:#eef2f7;
    color:#334155;
  }
  .msg{
    min-height:24px;
    margin-top:12px;
    color:var(--danger);
    font-weight:700;
  }
  .hint{
    margin-top:10px;
    color:var(--muted);
    font-size:13px;
    line-height:1.6;
  }
  #result{
    margin-top:24px;
    display:none;
  }
  .result-head{
    display:flex;
    justify-content:space-between;
    gap:12px;
    align-items:flex-end;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .result-head h2{
    margin:0;
    font-size:24px;
  }
  .badge{
    display:inline-block;
    margin-top:6px;
    padding:5px 10px;
    background:var(--accent2);
    color:var(--accent);
    border-radius:999px;
    font-size:13px;
    font-weight:800;
  }
  .qa{
    background:white;
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px;
    margin:12px 0;
    box-shadow:0 4px 14px rgba(15,23,42,.04);
  }
  .q{
    font-weight:900;
    line-height:1.6;
    margin-bottom:10px;
  }
  .a{
    background:#f8fafc;
    border-left:4px solid var(--accent);
    padding:12px 14px;
    border-radius:8px;
    line-height:1.7;
    font-size:17px;
  }
  .footer{
    text-align:center;
    color:#94a3b8;
    margin-top:24px;
    font-size:12px;
  }
  @media print{
    body{background:white}
    .panel,.hero p,.footer,.actions,.msg,.hint{display:none!important}
    .wrap{max-width:none;padding:0}
    #result{display:block!important;margin-top:0}
    .qa{box-shadow:none;break-inside:avoid}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>數據導航－探索未來</h1>
    <p>輸入座號並選擇學習單單元，即可顯示該座號對應的題目與答案。</p>
  </div>

  <section class="panel">
    <div class="grid">
      <div>
        <label class="title" for="seat">座號</label>

        <div class="hint">有效座號：1～15、20～32</div>
      </div>

      <div>
        <span class="title">選擇學習單單元</span>
        <div class="unit-box">
          <div class="unit">
            <input type="radio" name="unit" id="u1" value="unit1">
            <label for="u1">探索未來 1<small>台灣的補習文化</small></label>
          </div>
          <div class="unit">
            <input type="radio" name="unit" id="u2" value="unit2">
            <label for="u2">探索未來 2<small>各國的補習文化</small></label>
          </div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="primary" id="showBtn">顯示我的答案</button>
      <button class="secondary" id="clearBtn" type="button">重新輸入</button>
    </div>
    <div class="msg" id="msg"></div>
  </section>

  <section id="result">
    <div class="result-head">
      <div>
        <h2 id="resultTitle"></h2>
        <div class="badge" id="studentBadge"></div>
      </div>
      <button class="secondary" onclick="window.print()">列印／存成 PDF</button>
    </div>
    <div id="qaList"></div>
  </section>

  <div class="footer">本頁面依座號固定配對答案版本；相同座號每次查詢會得到相同答案。</div>
</div>

function getSelectedUnit(){
  const chosen = document.querySelector('input[name="unit"]:checked');
  return chosen ? chosen.value : null;
}

function showAnswers(){
  const seat = Number(document.getElementById("seat").value);
  const unitKey = getSelectedUnit();
  const msg = document.getElementById("msg");
  const result = document.getElementById("result");

  msg.textContent = "";
  result.style.display = "none";

  if(!validSeats.includes(seat)){
    msg.textContent = "請輸入有效座號：1～15、20～32。";
    return;
  }
  if(!unitKey){
    msg.textContent = "請先選擇「探索未來 1」或「探索未來 2」。";
    return;
  }

  const index = validSeats.indexOf(seat);
  const unit = data[unitKey];

  document.getElementById("resultTitle").textContent = unit.title;
  document.getElementById("studentBadge").textContent = `座號 ${seat}｜答案版本 ${index + 1}`;

  const qaList = document.getElementById("qaList");
  qaList.innerHTML = "";

  unit.questions.forEach((q, qi) => {
    const card = document.createElement("div");
    card.className = "qa";

    const qEl = document.createElement("div");
    qEl.className = "q";
    qEl.textContent = q;

    const aEl = document.createElement("div");
    aEl.className = "a";
    aEl.textContent = unit.answers[qi][index];

    card.appendChild(qEl);
    card.appendChild(aEl);
    qaList.appendChild(card);
  });

  result.style.display = "block";
  result.scrollIntoView({behavior:"smooth", block:"start"});
}

document.getElementById("showBtn").addEventListener("click", showAnswers);

document.getElementById("seat").addEventListener("keydown", e => {
  if(e.key === "Enter") showAnswers();
});

document.getElementById("clearBtn").addEventListener("click", () => {
  document.getElementById("seat").value = "";
  document.querySelectorAll('input[name="unit"]').forEach(x => x.checked = false);
  document.getElementById("msg").textContent = "";
  document.getElementById("result").style.display = "none";
  document.getElementById("seat").focus();
});
</script>
