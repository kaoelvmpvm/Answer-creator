<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>數據導航｜探索未來答案查詢</title>
<style>
:root {
  --ink:#1f2937; --muted:#64748b; --line:#d9e2df;
  --main:#315f54; --soft:#eaf3f0; --warn:#b42318;
}
*{box-sizing:border-box}
body{
  margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  background:linear-gradient(180deg,#eaf2ef 0,#f8fafc 300px,#f4f7f6 100%);
  color:var(--ink);
}
.wrap{max-width:920px;margin:auto;padding:34px 18px 60px}
header{text-align:center;margin-bottom:22px}
h1{margin:0 0 8px;font-size:clamp(27px,5vw,40px);letter-spacing:.04em}
header p{margin:0;color:var(--muted);line-height:1.7}
.panel{
  background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;
  box-shadow:0 10px 30px rgba(15,23,42,.07)
}
.form-grid{display:grid;grid-template-columns:240px 1fr;gap:22px}
@media(max-width:720px){.form-grid{grid-template-columns:1fr}}
.title{display:block;font-weight:800;margin-bottom:9px}
input[type=text]{
  width:100%;padding:13px 14px;border:1px solid #cbd5e1;border-radius:12px;
  font-size:18px;outline:none
}
input[type=text]:focus{border-color:var(--main);box-shadow:0 0 0 3px rgba(49,95,84,.12)}
.seat-hint{color:var(--muted);font-size:13px;margin-top:7px;line-height:1.6}
.units{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:520px){.units{grid-template-columns:1fr}}
.unit{position:relative}
.unit input{position:absolute;opacity:0;pointer-events:none}
.unit label{
  display:block;min-height:72px;padding:13px 15px;border:1px solid #cbd5e1;
  border-radius:14px;cursor:pointer;font-weight:800;background:#fff;transition:.16s ease
}
.unit label small{display:block;margin-top:5px;color:var(--muted);font-weight:500}
.unit input:checked+label{border-color:var(--main);background:var(--soft);box-shadow:0 0 0 2px rgba(49,95,84,.10)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
button{border:0;border-radius:12px;padding:12px 18px;font-size:16px;font-weight:800;cursor:pointer}
.primary{background:var(--main);color:#fff}
.secondary{background:#edf1f4;color:#334155}
#message{min-height:23px;margin-top:11px;color:var(--warn);font-weight:700}
#result{display:none;margin-top:24px}
.result-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.result-head h2{margin:0;font-size:24px}
.badge{
  display:inline-block;margin-top:7px;padding:5px 10px;background:var(--soft);
  color:var(--main);border-radius:999px;font-size:13px;font-weight:800
}
.note{
  display:none;margin:0 0 14px;padding:11px 14px;background:#fff8e8;border:1px solid #f0d99b;
  border-radius:12px;color:#6b5315;line-height:1.6;font-size:14px
}
.qa{
  background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0;
  box-shadow:0 4px 14px rgba(15,23,42,.04)
}
.q{font-weight:900;line-height:1.65;margin-bottom:10px}
.a{
  background:#f8fafc;border-left:4px solid var(--main);border-radius:8px;
  padding:12px 14px;line-height:1.75;font-size:17px;white-space:pre-line
}
footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:24px;line-height:1.7}
@media print{
  body{background:#fff} header p,.panel,footer{display:none!important}
  .wrap{max-width:none;padding:0} #result{display:block!important;margin-top:0}
  .qa{box-shadow:none;break-inside:avoid}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>數據導航｜探索未來</h1>
  <p>輸入完整班級座號並選擇學習單，即可查看固定對應的作答內容。</p>
</header>

<section class="panel">
<div class="form-grid">
  <div>
    <label class="title" for="seat">班級座號</label>
    <input id="seat" type="text" inputmode="numeric" maxlength="5" placeholder="例如：81501" autocomplete="off">
    <div class="seat-hint">
      815班：81501～81515、81520～81532<br>
      816班：81601～81614、81620～81632
    </div>
  </div>
  <div>
    <span class="title">選擇學習單單元</span>
    <div class="units">
      <div class="unit"><input type="radio" name="unit" id="u1" value="unit1"><label for="u1">探索未來 1<small>台灣的補習文化</small></label></div>
      <div class="unit"><input type="radio" name="unit" id="u2" value="unit2"><label for="u2">探索未來 2<small>各國的補習文化</small></label></div>
      <div class="unit"><input type="radio" name="unit" id="u4" value="unit4"><label for="u4">探索未來 4<small>我想上什麼課？</small></label></div>
      <div class="unit"><input type="radio" name="unit" id="u5" value="unit5"><label for="u5">探索未來 5<small>我未來要做什麼？</small></label></div>
    </div>
  </div>
</div>
<div class="actions">
  <button class="primary" id="showBtn" type="button">顯示答案</button>
  <button class="secondary" id="clearBtn" type="button">重新輸入</button>
</div>
<div id="message" role="alert" aria-live="polite"></div>
</section>

<section id="result">
<div class="result-head">
  <div><h2 id="resultTitle"></h2><div class="badge" id="seatBadge"></div></div>
  <button class="secondary" id="printBtn" type="button">列印／存成 PDF</button>
</div>
<div class="note" id="unitNote"></div>
<div id="qaList"></div>
</section>

<footer>
  同一班級座號每次查詢皆會取得相同答案。<br>
  探索未來3暫未納入本版本。
</footer>
</div>

document.addEventListener("DOMContentLoaded",()=>{
  const seatInput=document.getElementById("seat");
  const showBtn=document.getElementById("showBtn");
  const clearBtn=document.getElementById("clearBtn");
  const printBtn=document.getElementById("printBtn");
  const message=document.getElementById("message");
  const result=document.getElementById("result");
  const resultTitle=document.getElementById("resultTitle");
  const seatBadge=document.getElementById("seatBadge");
  const unitNote=document.getElementById("unitNote");
  const qaList=document.getElementById("qaList");

  function selectedUnit(){
    const chosen=document.querySelector('input[name="unit"]:checked');
    return chosen?chosen.value:null;
  }

  function showAnswers(){
    const seat=seatInput.value.trim();
    const unitKey=selectedUnit();
    message.textContent="";
    result.style.display="none";

    if(!validSeats.includes(seat)){
      message.textContent="請輸入有效班級座號。";
      seatInput.focus();
      return;
    }
    if(!unitKey||!data[unitKey]){
      message.textContent="請先選擇一張學習單。";
      return;
    }

    const answerIndex=validSeats.indexOf(seat);
    const unit=data[unitKey];
    resultTitle.textContent=unit.title;
    seatBadge.textContent=`班級座號 ${seat}`;

    if(unit.note){
      unitNote.textContent=unit.note;
      unitNote.style.display="block";
    }else{
      unitNote.textContent="";
      unitNote.style.display="none";
    }

    qaList.innerHTML="";
    unit.questions.forEach((question,qi)=>{
      const card=document.createElement("div");
      card.className="qa";
      const q=document.createElement("div");
      q.className="q";
      q.textContent=question;
      const a=document.createElement("div");
      a.className="a";
      a.textContent=unit.answers[qi][answerIndex]||"此題目前沒有設定答案。";
      card.appendChild(q); card.appendChild(a); qaList.appendChild(card);
    });

    result.style.display="block";
    result.scrollIntoView({behavior:"smooth",block:"start"});
  }

  showBtn.addEventListener("click",showAnswers);
  clearBtn.addEventListener("click",()=>{
    seatInput.value="";
    document.querySelectorAll('input[name="unit"]').forEach(el=>el.checked=false);
    message.textContent="";
    result.style.display="none";
    qaList.innerHTML="";
    seatInput.focus();
  });
  printBtn.addEventListener("click",()=>window.print());
  seatInput.addEventListener("input",()=>{seatInput.value=seatInput.value.replace(/\D/g,"").slice(0,5);});
  seatInput.addEventListener("keydown",e=>{
    if(e.key==="Enter"){e.preventDefault();showAnswers();}
  });
});
</script>

</html>
